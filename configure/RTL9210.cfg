;**************************************************************
;Realtek RTL9210 - generic configuration
;Every option below is listed, active or commented, so the file
;doubles as a reference of the available parameters.
;**************************************************************

;=================Device identification=========================
VID = 0xbda
PID = 0x9210
MANUFACTURE = "Realtek"
PRODUCT = "RTL9210"
;"0123" for Dec, "0x0123" for Hex, max 12 digits
SERIAL = "012625678208"

;SCSI_VENDOR / SCSI_PRODUCT override the strings the OS shows for
;the DRIVE, not for the enclosure. Leave them commented so the real
;NVMe model passes through - SMART/vendor tools (Samsung Magician,
;Lexar, Crucial) need it. Setting them on fw 1.34.x has been reported
;to show the disk as "n/a n/a" and to pad the strings with spaces.
;If you do set them, pad to the SCSI field width: vendor 8 chars,
;product 16 chars, e.g. "Realtek " / "RTL9210 NVME    "
;SCSI_VENDOR = "Realtek"
;SCSI_PRODUCT = "RTL9210 NVME"

;=================LED===========================================
;0x0 disabled / 0x1 / 0x2 / 0x3 depending on the enclosure wiring
LED = 0x3
;LED light profile
HW_LED_CFG = 0x0
;CUSTOMIZED_LED is up to 15 bytes
CUSTOMIZED_LED = 00 00
;0x0 LED stays lit after eject, 0x1 turns it off
SUSPEND_LED_OFF = 0x0

;=================Power management==============================
;WARNING: the three settings below cut power to the NVMe drive.
;If the OS has not flushed its write cache yet, data is lost.
;Windows 10/11 already suspend USB aggressively on their own
;(USB selective suspend fires after seconds of inactivity), so the
;controller-side timers are a second, independent kill switch.

;Idle minutes before the controller powers down the PCIe bus.
;Default when absent is "never power off" - keep it commented.
;DISK_IPS_THRES = 0xa

;Same idea, separate timer (1 unit = 1 minute). Keep commented.
;PCIE_PWRCUT_THRES = 0x5

;Behaviour when the host requests suspend. Undocumented by Realtek:
;values seen in the wild are 0x1 (BENFEI) and 0x7 (Jeyi, Realtek
;defaults). 0x7 is the most aggressive of the two. Left at the
;Realtek default - drop to 0x1, or comment out, if the drive fails
;to come back from sleep.
SUSPEND_DISK_OFF = 0x7

;0x0 lets the link enter low power states (higher latency),
;0x1 disables ASPM. Use 0x1 for boot/WinToGo drives.
;ASPMDIS = 0x0

;USB 3.0 Link Power Management. Set 0x0 if you see random disconnects.
;EN_U1U2 = 0x1
;EN_UPS = 0x1
;PD = 0x1

;Initialise the controller fully before the disk instead of in
;parallel. Avoids power spikes on bus-powered / internal USB ports
;and fixes hangs during UEFI USB enumeration. Recommended for boot
;drives on servers and SBCs.
;LATE_INIT_DISK = 0x1

;=================Power budget advertised to the host===========
;Only declares the expected draw to the host controller, it does not
;limit actual consumption. If the host thinks there is not enough
;power it renegotiates down to USB 2.0, which loses UASP and TRIM.
;0xfa = 500 mA / 2.5 W (USB 2.0), 0x70 = 896 mA / 4.5 W (USB 3.x)
U2_MAXPWR = 0xfa
U3_MAXPWR = 0x70

;=================Disk / bus====================================
;GPIO pin of the hardware write-protect switch. 0xc is pin 12.
;Set to 0x0 if the enclosure has no WP switch.
SCSI_WP_PIN = 0xc
;Hot-swapping the drive while the enclosure stays plugged in.
;0x0 on nearly every enclosure - only enable it if yours supports it.
;DISK_HOTPLUG = 0x1
;Show the enclosure to the OS with no drive fitted (needed to reflash)
;DIS_SHOW_EMPTY_DISK = 0x1
;Enclosure with (0x1) or without (0x0) a fan
;FAN = 0x0
;CFExpress card reader - always 0x0 on external enclosures
;CFEXPRESS = 0x0

;=================Compatibility quirks==========================
;FORCE_USB_SPEED = 0x0
;FORCE_PCIE_SPEED = 0x0
;FORCE_USB_QUIRK = 0x0
;FORCE_PCIE_QUIRK = 0x0
;FORCE_SATA_NORMAL_DMA = 0x0
;FORCE_PORT_TYPE = 0x0
;PCIE_REFCLK = 0x0
;PINMUX1 = 0x0
;PINMUX2 = 0x0
;U2PHY = 02 f4 9b e0 e1
;U3PHY = 02 d4 09 00 d5 00 80

;=================Debug / misc==================================
;UART_DBG_PIN = 0x5
;UART_BAUD_RATE = 0x0
;RM_INTERNAL_RD = 0x0
;HS_AUTO_SWITCH = 0x0
;CUSTOMIZED_DISK_IDENTIFY = 0x0
;SUPPORT_HID = 0x0
;CDROM_CFG = 0x0
;SD_MMC_TYPE = 0x0
;FINGER_PRINT_EN = 0x0

;=================Tool Configure=================================
;MPtool increments SERIAL by 1 on every flash unless this is n.
;It is also a checkbox in the tool - the checkbox wins.
INC_SERIAL = n
FORMAT_DISK = n
;DISCONN_FORCE_USB2 = n
;PARTITION: GPT, MBR
;PARTITION = "MBR"
;FORMAT: NTFS, exFAT
;FORMAT = "NTFS"
;LABEL is the volume label, only applied when FORMAT_DISK = y
;LABEL = "My USB"
